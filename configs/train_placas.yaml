# ============================================================
# train_placas.yaml — Hiperparámetros Modelo 2: Detector de Placas
# ============================================================
# Opera sobre crops del ROI del micro — placa es el único objeto a detectar
# Modelo con capa P2 para objetos pequeños
model: yolo26n-p2.pt

# Dataset
data: configs/data_placas.yaml

# Entrenamiento
epochs: 150
patience: 30
batch: 32             # Modelo n + crops más pequeños → mayor batch
imgsz: 640
device: 0
workers: 8
seed: 42
deterministic: true

# Optimizador
optimizer: AdamW
lr0: 0.001
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3

# AMP
amp: true

# Guardado
save: true
save_period: 10
plots: true

# Augmentation (ajustada para placas en crops de micros)
mosaic: 0.5           # Reducido — mosaicos pueden crear combinaciones poco realistas
scale: 0.4            # Variación de tamaño en crop del micro
translate: 0.1        # Pequeños desplazamientos
degrees: 5.0          # Leve rotación — placas no siempre perfectamente horizontales
flipud: 0.0           # NO flip vertical
fliplr: 0.0           # NO flip horizontal — placa invertida es ilegible para OCR
hsv_h: 0.015
hsv_s: 0.5
hsv_v: 0.5            # Mayor variación brillo — placas en sombra o contraluz
perspective: 0.0002   # Perspectiva — placas en ángulo
erasing: 0.3          # Oclusión parcial de placa
blur: 2.0             # Motion blur — vehículo en movimiento
mixup: 0.0
copy_paste: 0.0

close_mosaic: 20

# Experimento
project: runs/placas
name: exp_m2_yolo26n-p2_640_b32
exist_ok: false
